<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>card</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        #main{
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        h1{
            background: black;
            color: white;
            font-size: 1.5rem;
            text-align: center;
            padding: 10px;
        }
     
        input{
            height: 1.5rem;
        }
        .card{
            width: 300px;
            height: auto;
            border: 1px solid black;
            border-radius: 16px;
            padding: 20px 10px;
            margin: 1rem;
            background-color: rgb(255, 246, 232);
        }
        .img-div{
            overflow: hidden;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 1px solid black;
        }
      
        .img-div img{
        width: 100%;
        height: 100%;
        object-fit: cover;
        }

        



    </style>
</head>

<body>
    <h1>Create Your Card</h1>
    <div id="main">
    <form>
        <input type="text" placeholder="profile img link"></input>
        <br><br>
        <input type="text" placeholder="username"></input>
        <br><br>
        <input type="text" placeholder="occupation"></input>
        <br><br>
        <input type="text" placeholder="gender"></input>
        <br><br>
        <input type="email" placeholder="email"></input>
        <br><br>
        <input type="tel" placeholder="phone no"  ></input>
        <br><br>
        <input type="submit" value="Create Card">
    </form></div>
