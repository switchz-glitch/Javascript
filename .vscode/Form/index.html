<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>User Management</title>
</head>
<body class="flex flex-col items-center justify-center min-h-screen gap-10 bg-radial-[at_25%_25%] from-white to-zinc-900 to-75%">

  <!-- FORM -->
  <form id="userForm" action="#" class="bg-white p-6 rounded-lg shadow-md w-full max-w-sm">
    <h2 class="font-semibold text-xl mb-4 text-center">Add User</h2>

    <div class="mb-5">
      <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
      <input id="name" type="text" required
        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-2 focus:ring-indigo-500 sm:text-sm" />
    </div>

    <div class="mb-5">
      <label for="role" class="block text-sm font-medium text-gray-700">Role</label>
      <input id="role" type="text" required
        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-2 focus:ring-indigo-500 sm:text-sm" />
    </div>

    <div class="mb-5">
      <label for="bio" class="block text-sm font-medium text-gray-700">Bio</label>
      <input id="bio" type="text" required
        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-2 focus:ring-indigo-500 sm:text-sm" />
    </div>

    <div class="mb-5">
      <label for="photo" class="block text-sm font-medium text-gray-700">Photo Url</label>
      <input id="photo" type="text" required
        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-2 focus:ring-indigo-500 sm:text-sm" />
    </div>

    <button type="submit"
      class="w-full mt-4 px-4 py-2 text-sm font-medium rounded-md text-white bg-black hover:bg-gray-800">Submit</button>
  </form>

  <!-- USERS CONTAINER -->
  <div class="users w-full max-w-lg"></div>


</body>
<script src="form.js"></script>
</html>
