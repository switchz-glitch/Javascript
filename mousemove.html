<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: black;
        }
        .box{
            height: 10px;
            width: 10px;
            background-color: white;
            position: absolute;
            transform: translate(-50%, -50%);
            transition: cubic-bezier(cubic-bezier(0.19, 1, 0.22, 1) 0.1s);
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
<script src="mousemove.js"></script>
</html>
